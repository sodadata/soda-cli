[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soda-cli"
version = "0.1.0-alpha"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
soda = "soda.main:app"

[tool.hatch.build.targets.wheel]
packages = ["soda"]
